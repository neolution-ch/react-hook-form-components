name: Build and Deploy Storybook

# Publishes the Storybook of each stable release to the gh-pages branch, which GitHub Pages
# serves at https://collana-solutions.github.io/react-hook-form-components. The Release
# workflow creates the GitHub release with the App token, so its `released` event starts
# this workflow. Prereleases do not fire `released`.
on:
  release:
    types: [released]

# Two releases in a row must not push to gh-pages at the same time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-storybook:
    name: Build and deploy Storybook
    runs-on: ubuntu-latest
    permissions:
      # Pushes the gh-pages branch.
      contents: write
    steps:
      # Checks out the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A deploy never restores a cache that a pull request run could have written.
          package-manager-cache: false

      # Activates the pnpm version pinned in the root manifest packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      # gh-pages clones the repository into its own cache directory and pushes from there.
      # The token reaches it through the repository URL, so the checkout keeps no credentials.
      - name: Deploy with gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          pnpm exec gh-pages
          --dist storybook-static
          --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          --user "github-actions-bot <support+actions@github.com>"
