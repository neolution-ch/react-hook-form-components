name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Activates the pnpm version pinned in the root manifest packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Version Packages PR consumes the changesets it releases, so the check cannot pass on it. A branch name
      # alone is no proof (anyone can push a changeset-release/* branch), so the PR must also come from the bot.
      - name: Check for changesets
        if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'csag-changesets-bot[bot]') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

  # Lints, builds and runs the Cypress component tests against every React major in the
  # peer range, on the maintained Node.js versions that pnpm 11 supports.
  test:
    name: Test (Node ${{ matrix.node-version }}, React ${{ matrix.react-version }})
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        react-version: ["^18.2.0", "^19.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Swaps in the newest React release of the matrix range, still subject to the
      # minimumReleaseAge floor. The Cypress app links react and react-dom from the root
      # node_modules, so the component tests run against this version too.
      - name: Install React ${{ matrix.react-version }}
        env:
          REACT_VERSION: ${{ matrix.react-version }}
        run: pnpm add --save-dev "react@$REACT_VERSION" "react-dom@$REACT_VERSION" # zizmor: ignore[adhoc-packages] the lockfile holds one React version, the matrix tests each supported major

      - name: Lint
        run: pnpm run lint

      # rollup-plugin-typescript2 type-checks src and fails the build on errors.
      - name: Build
        run: pnpm run build

      - name: Check formatting
        run: pnpm run prettier-check

      # The Cypress app has its own lockfile and links the package from ../dist.
      - name: Install Cypress Dependencies
        working-directory: ./cypress
        run: pnpm install --frozen-lockfile

      - name: Component Tests
        working-directory: ./cypress
        run: pnpm exec cypress run --component

      - name: Upload screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-snapshots-node${{ matrix.node-version }}-react${{ matrix.react-version }}
          path: |
            ./cypress/cypress/screenshots
            ./cypress/cypress/videos

  # Keep the job name: the branch ruleset requires the "Verify" check. It reports the
  # whole test matrix under one name.
  verify:
    name: Verify
    needs: test
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the test results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Test matrix: $RESULT"
          [ "$RESULT" = "success" ]

  # Static analysis of the workflows themselves (template injection, unpinned actions,
  # excessive permissions). Findings fail the job.
  zizmor:
    name: zizmor
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
